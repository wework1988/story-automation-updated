; Documentary Engine — DeepSeek configuration (standalone)
; API key: repo-root .env → DEEPSEEK_API_KEY

[deepseek_connection]
base_url = https://api.deepseek.com
model = deepseek-v4-pro
api_max_retries = 10
temperature = 0.3

[thinking]
enabled = true
reasoning_effort = high

[smart_search]
internet_enabled = true
search_type = web

[token_budget]
max_tokens_research = 65536
max_tokens_extraction = 65536
max_tokens_timeline = 32768
max_tokens_characters = 32768
max_tokens_architect = 32768
max_tokens_script = 65536
max_tokens_retention = 32768
max_tokens_verification = 32768
max_tokens_gap_research = 32768

[youtube_research]
candidate_limit = 20
select_count = 4
min_views = 50000
min_engagement_rate = 0.002
min_duration_seconds = 300

[pipeline]
duration_minutes = 30
chars_per_minute = 1000
human_checkpoint = true
series_id =

[editorial]
language = hindi
disclaimer = true
