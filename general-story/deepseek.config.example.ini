; -----------------------------------------------------------------------------
; DeepSeek general-story pipeline configuration (friendly INI format)
; -----------------------------------------------------------------------------
;
; Loaded when you run general-story/run_with_params.sh (via crime-section/helper/deepseek_pipeline.py
; with --crime-root pointing at this general-story/ folder).
;
; EDIT THIS FILE ONLY (values on the RIGHT of "=").
;
; Prefer repo-root .env for DEEPSEEK_API_KEY — never paste API secrets into this INI.
;
; -----------------------------------------------------------------------------

[pipeline]

; Folder under general-story/stories/ … one short name only (dash ok, no slashes)
; Usually overridden by run_with_params.sh MY_FOLDER_NAME / STORY=… (sample: yasin)
folder_name = yasin

; 1–4 — same semantics as crime-section (see crime-section README)
max_step = 4

force = false

recreate_story_folder = false

; When true, pipeline reads stories/<slug>/template/character.txt and injects it into
; Stages A/B/C (CHARACTER_LIBRARY). If file is missing or empty, sends NONE.
use_character_library = true

; OPTIONAL — leave EMPTY to auto-use general-story/story-to-run/story.txt
; Paths relative to PROJECT ROOT (parent of general-story/).
story_txt_path =

[deepseek_connection]

base_url = https://api.deepseek.com

model = deepseek-v4-pro

api_max_retries = 12

[temperature]

value = 0.3

[thinking]

enabled = true

reasoning_effort = max

[token_budget]

max_tokens_stage_a = 65536

max_tokens_stage_b = 131072

max_tokens_stage_c = 65536

scene_batch = 8

; Retries per Stage C API window when the model returns fewer scenes than requested
stage_c_batch_retries = 3

; Minimum expected chars per scene in a batch (short replies trigger retry)
stage_c_min_chars_per_scene = 1200

stage_b_story_segments = 10

stage_b_auto_target_chars = 1300

stage_b_segment_hard_cap = 24

stage_b_cap_segments_by_story_length = false

stage_b_min_chars_per_segment = 2600

stage_b_segment_overlap_chars = 220

[genre_hint]

mood_hint =

[smart_search]

internet_enabled = false

internet_search_kind = web

internet_search_legacy_dual_flag = false

[safety]

allow_truncated_saves = false

[terminal]

show_api_output = false

show_progress_bar = true

stream_api_output = false

max_print_chars = 12000

stage_b_terminal_scenes = 10
