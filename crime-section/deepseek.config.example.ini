; -----------------------------------------------------------------------------
; DeepSeek crime-section pipeline configuration (friendly INI format)
; -----------------------------------------------------------------------------
;
; This file is LOADED AUTOMATICALLY on every pipeline run (see helper/deepseek_pipeline.py).
;
; EDIT THIS FILE ONLY (change values on the RIGHT of "=" — keep "=" signs).
; Lines starting with ";" are hints for humans; DeepSeek/Python ignores them.
;
; Prefer repo-root .env for DEEPSEEK_API_KEY — never paste API secrets into this INI.
;
; If something is also exported in Terminal or stored in .env → that value wins first.
;
; -----------------------------------------------------------------------------

[pipeline]

; Folder under crime-section/stories/ … one short name only (dash ok, no slashes)
folder_name = sample-story

; How far automation runs — must be digit 1, 2, 3, or 4
;
;   1 = create folder & copy script only (no DeepSeek chat yet)
;   2 = 1 + “story settings” file (Stage A)
;   3 = 2 + full scene breakdown (Stages A+B) — stops before image prompts
;   4 = full run incl. Stage C image+motion prompts
max_step = 4

; true / false … redo AI outputs even when files exist (recovery after crashes)
force = false

; true / false … delete the whole episode folder named above and remake empty shell
recreate_story_folder = false

; true / false … reuse stories/<folder_name>/template/character.txt locked faces/bodies
use_character_library = false

; OPTIONAL — leave EMPTY to auto-use crime-section/story-to-run/story.txt
; Relative paths start from PROJECT ROOT (same place as crime-section/).
; story_txt_path =
story_txt_path =

[deepseek_connection]

base_url = https://api.deepseek.com

; Common IDs: deepseek-v4-pro, deepseek-v4-flash, deepseek-reasoner
model = deepseek-v4-pro

; Transient disconnects mid-response (TCP reset etc.) → automatic retries with backoff
api_max_retries = 12

[temperature]

; 0.3 = steadier factual layout; reasoning models ignore this sometimes
value = 0.3

[thinking]

; true / false — turns on chain-of-thought plumbing for deepseek-v4-* (skipped for deepseek-*-reasoner)
enabled = true

; Allowed words: low, medium, high, max (everything below high maps to high in API)
reasoning_effort = max

[token_budget]

; Increase if Stage A stops mid-file (completion length limit reached)
max_tokens_stage_a = 65536

; Same idea for mega scene-breakdown dumps
max_tokens_stage_b = 65536

; Each Stage‑C batched call prints many scenes → keep generous
max_tokens_stage_c = 65536

; ONLY when pipeline max_step is 4 — scenes per DeepSeek completion batch
scene_batch = 8

; Stage B — how many sequential breakdown API calls merge into one output file.
;
; Fixed N: try ~5–8 for long Hindi scripts; very high counts on short manuscripts worsen timeline drift.
; Auto: set stage_b_story_segments = 0 — slices ≈ ceil(story_chars / stage_b_auto_target_chars), capped below.
stage_b_story_segments = 6

; AUTO mode only (when stage_b_story_segments is 0 or negative): target characters per FULL_STORY slice
stage_b_auto_target_chars = 1300

; Hard ceiling on slice count (manual AND auto modes)
stage_b_segment_hard_cap = 24

; true / false — cap splits using story length ÷ stage_b_min_chars_per_segment (recommended true)
stage_b_cap_segments_by_story_length = true

; With cap: minimum printable chars averaged per FULL_STORY slice below which we shrink slice count further
stage_b_min_chars_per_segment = 2600

; Paragraph-trimmed tail from prior slice; keep modest (large overlap ⇒ models rewind / duplicate beats)
stage_b_segment_overlap_chars = 220

[genre_hint]

mood_hint =

[smart_search]

; true / false — internet lookup inside DeepSeek (slower, may drift facts)
internet_enabled = false

; Passed as extra_body.search.type — default mirrors recent chat snippets
internet_search_kind = web

; true / false — also sends legacy flat enable_search:true for old samples
internet_search_legacy_dual_flag = false

[safety]

; true / false — normally leave false … allows saving CUT-OFF / broken drafts
allow_truncated_saves = false

[terminal]

; true = print MODEL OUTPUT blocks after each Stage A/B/C API call. false = write files only (+ progress lines).
show_api_output = false

; Overall % · ASCII bar · what is running (Stage A/B/C · calling DeepSeek API …).
show_progress_bar = true

; Live streaming — only applies when show_api_output = true.
stream_api_output = false

; Max characters printed per non-stream completion (0 = unlimited). Full text always saved to disk.
max_print_chars = 12000

; Stage B only: terminal chunks of N scenes (line-start Scene headings). 0 = one paste. Ignored when show_api_output = false.
stage_b_terminal_scenes = 10
